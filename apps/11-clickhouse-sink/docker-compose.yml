services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: sink
      CLICKHOUSE_USER: sink
      CLICKHOUSE_PASSWORD: sink
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "sink", "--password", "sink", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  clickhouse-data:
