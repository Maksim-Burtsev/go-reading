services:
  redpanda:
    image: redpandadata/redpanda:v25.1.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19012
    ports:
      - "19012:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 2s
      timeout: 5s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    environment:
      CLICKHOUSE_DB: eventsink
      CLICKHOUSE_USER: eventsink
      CLICKHOUSE_PASSWORD: eventsink
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "9012:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "eventsink", "--password", "eventsink", "--query", "SELECT 1"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventsink
      POSTGRES_USER: eventsink
      POSTGRES_PASSWORD: eventsink
    ports:
      - "5412:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsink -d eventsink"]
      interval: 2s
      timeout: 3s
      retries: 15

  eventsink:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/12-eventsink/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      CLICKHOUSE_URL: clickhouse://eventsink:eventsink@clickhouse:9000/eventsink?dial_timeout=5s&compress=lz4
      DATABASE_URL: postgres://eventsink:eventsink@postgres:5432/eventsink?sslmode=disable
    ports:
      - "8012:8012"
    stop_grace_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  clickhouse-data:
  postgres-data:
