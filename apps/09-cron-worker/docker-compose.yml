services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cron
      POSTGRES_PASSWORD: cron
      POSTGRES_DB: cron
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cron -d cron"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
